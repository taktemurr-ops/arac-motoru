name: arac_motoru
description: "Araç Kutusu motoru: 68 çevrimdışı araç (hesap, çevirici, sensör, kamera, ses, zaman, ağ, NFC, IR, Bluetooth, arşiv)."
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 8cb935c63a86ca3e5fb38758edd5bb8ec44dccdd
  archive: ">=4.0.2 <5.0.0"
  audioplayers: ^6.5.0
  battery_plus: ">=6.0.0 <8.0.0"
  camera: ^0.12.0
  device_info_plus: ">=10.1.0 <13.0.0"
  file_picker: ">=8.1.0 <11.0.0"
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  geolocator: ">=13.0.0 <15.0.0"
  http: ^1.2.2
  mobile_scanner: ">=6.0.0 <8.0.0"
  ndef_record: ^1.4.2
  network_info_plus: ">=6.0.0 <8.0.0"
  nfc_manager: ^4.1.0
  path_provider: ^2.1.4
  permission_handler: ">=11.3.1 <13.0.0"
  qr_flutter: ^4.1.0
  record: ">=5.2.0 <7.0.0"
  sensors_plus: ">=6.1.0 <8.0.0"
  timezone: ">=0.10.0 <0.11.0"
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gamestudio100.arac_motoru
        pluginClass: AracMotoruPlugin
      ios:
        pluginClass: AracMotoruPlugin
